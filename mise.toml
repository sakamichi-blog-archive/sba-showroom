[settings]
auto_install = false
pin = true

[tools]
go = "1.26.4"
golangci-lint = "2.12.2"
pinact = "4.1.0"

# Tasks are sorted alphabetically.
[tasks.build]
run = "go build -o sba-showroom ."
description = "Build binary"

[tasks.check]
depends = ["format:check", "lint", "test"]
description = "Run all checks"

[tasks.format]
run = "gofmt -w ."
description = "Format Go source files"

[tasks."format:check"]
run = 'test -z "$(gofmt -l .)"'
description = "Check Go source files are formatted"

[tasks.lint]
run = "golangci-lint run ./..."
description = "Lint Go source files"

[tasks.test]
run = "go test ./..."
description = "Run tests"
